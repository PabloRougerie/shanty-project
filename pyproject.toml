[project]
name = "vessel-tracker"
version = "0.1.0"
description = "Maritime vessel position prediction from AIS data"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "lightgbm>=4.0",
    "matplotlib>=3.8",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "pydantic-settings[yaml]>=2.5",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vessel_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbstripout>=0.7",
    "pre-commit>=3.5",
    "pytest>=8.0",
    "ruff>=0.8",
]
notebooks = [
    "geopandas>=1.0",
    "seaborn>=0.13",
]
